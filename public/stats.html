<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lucky Cover — Button Data</title><style>body{margin:0;background:#f5f1e8;color:#171713;font-family:system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 32px));margin:40px auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}a{color:inherit}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card,.table{background:#fffdf8;border:1px solid #d9d1c3;border-radius:16px;padding:22px}.card span{font-size:11px;color:#766f63}.card strong{display:block;font-size:36px;margin-top:8px}.table{margin-top:14px}.row{display:grid;grid-template-columns:1fr 90px;padding:11px 0;border-bottom:1px solid #eee8dc}.row:last-child{border:0}.muted{color:#766f63;font-size:12px}.error{color:#c33}@media(max-width:650px){.cards{grid-template-columns:1fr}.row{grid-template-columns:1fr 60px}}</style></head><body><div class="wrap"><header><div><h1>Button Data</h1><p class="muted">Live aggregate results from redpacketcover.com</p></div><a href="/">← Website</a></header><div id="app">Loading…</div></div><script>const names={'physical-dragon':'Gilded Dragon','physical-plum':'Plum Bloom','physical-tiger':'Midnight Tiger','physical-crane':'Origami Crane','virtual-purple-fireworks':'Purple Fireworks','virtual-love-fireworks':'Love Fireworks','virtual-winter-wish':'Winter Wish','virtual-fairytale-castle':'Fairytale Castle'};fetch('/api/stats').then(r=>r.json()).then(d=>{const rows=Object.entries(names).map(([id,name])=>`<div class="row"><span>${name}</span><strong>${d.cover_select[id]||0}</strong></div>`).join('');document.querySelector('#app').innerHTML=`<div class="cards"><div class="card"><span>TOTAL BUTTON EVENTS</span><strong>${d.events}</strong></div><div class="card"><span>PHYSICAL FINAL VOTES</span><strong>${d.final_vote.physical}</strong></div><div class="card"><span>DIGITAL FINAL VOTES</span><strong>${d.final_vote.digital}</strong></div></div><div class="table"><h2>Cover selections</h2>${rows}</div><div class="table"><div class="row"><span>Custom design email clicks</span><strong>${d.custom_email_click}</strong></div></div>`}).catch(()=>document.querySelector('#app').innerHTML='<p class="error">Unable to load data.</p>')</script></body></html>
